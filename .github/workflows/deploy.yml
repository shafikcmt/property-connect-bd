name: Deploy

# Manual re-deploy button (e.g. after editing the server .env). Normal deploys happen from ci.yml on every push to main, after tests pass.
on:
  workflow_dispatch:

concurrency: production-deploy

jobs:
  deploy:
    runs-on: [self-hosted, linux, pcbd]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and roll out
        run: bash scripts/deploy-docker.sh
