name: Deploy

# Manual only: nothing deploys unless someone presses "Run workflow". Runs on the server's own runner (label pcbd).
on:
  workflow_dispatch:

concurrency: production-deploy

jobs:
  deploy:
    runs-on: [self-hosted, linux, pcbd]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and roll out
        run: bash scripts/deploy-docker.sh
