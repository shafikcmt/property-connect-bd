# Traffic arrives from the Cloudflare Tunnel container over the private compose network (ADR-0018).
map $http_x_forwarded_proto $fcgi_https { default off; https on; }

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location ~ /\.(?!well-known) { deny all; }

    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /storage/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
}
